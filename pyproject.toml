[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon.py"
version = "0.1.0"
description = "Implementation of the Falcon signature scheme"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    {name = "Thomas Prest", email = "thomas.prest@ens.fr"}
]
urls = {Homepage = "https://github.com/tprest/falcon.py"}
keywords = ["cryptography", "post-quantum", "signature", "falcon"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.19.0",
    "pycryptodome>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "pyprof2calltree>=1.4.5",
]

[tool.setuptools]
packages = ["falcon"]